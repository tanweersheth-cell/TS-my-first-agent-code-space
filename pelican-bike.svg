<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican flying on a blue bicycle</title>
  <desc>A cartoon pelican riding a blue bicycle through the air, wings spread, high above the ground.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe8ee"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="690" cy="105" r="52" fill="#ffe08a"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="110" rx="62" ry="28"/>
    <ellipse cx="205" cy="122" rx="46" ry="22"/>
    <ellipse cx="108" cy="126" rx="40" ry="20"/>
    <ellipse cx="470" cy="80" rx="50" ry="22"/>
    <ellipse cx="515" cy="90" rx="38" ry="18"/>
  </g>

  <!-- distant ground, far below because we are up in the air -->
  <rect y="556" width="800" height="44" fill="#8fd28f"/>
  <line x1="0" y1="556" x2="800" y2="556" stroke="#6fbf6f" stroke-width="4"/>
  <ellipse cx="150" cy="556" rx="180" ry="26" fill="#a7dda7"/>
  <ellipse cx="640" cy="556" rx="220" ry="30" fill="#a7dda7"/>

  <!-- ============ BICYCLE + PELICAN, FLYING ============ -->
  <g transform="translate(0,-170) rotate(-7 400 400)">

  <!-- ================= BICYCLE ================= -->

  <!-- wheels -->
  <g stroke="#2b2b2b" fill="none">
    <!-- rear wheel -->
    <circle cx="230" cy="450" r="85" stroke-width="11"/>
    <circle cx="230" cy="450" r="72" stroke="#9aa4aa" stroke-width="3"/>
    <g stroke="#b9c2c7" stroke-width="2">
      <line x1="158" y1="450" x2="302" y2="450"/>
      <line x1="167.6" y1="414" x2="292.4" y2="486"/>
      <line x1="194" y1="387.6" x2="266" y2="512.4"/>
      <line x1="230" y1="378" x2="230" y2="522"/>
      <line x1="266" y1="387.6" x2="194" y2="512.4"/>
      <line x1="292.4" y1="414" x2="167.6" y2="486"/>
    </g>
    <circle cx="230" cy="450" r="8" fill="#2b2b2b"/>

    <!-- front wheel -->
    <circle cx="560" cy="450" r="85" stroke-width="11"/>
    <circle cx="560" cy="450" r="72" stroke="#9aa4aa" stroke-width="3"/>
    <g stroke="#b9c2c7" stroke-width="2">
      <line x1="488" y1="450" x2="632" y2="450"/>
      <line x1="497.6" y1="414" x2="622.4" y2="486"/>
      <line x1="524" y1="387.6" x2="596" y2="512.4"/>
      <line x1="560" y1="378" x2="560" y2="522"/>
      <line x1="596" y1="387.6" x2="524" y2="512.4"/>
      <line x1="622.4" y1="414" x2="497.6" y2="486"/>
    </g>
    <circle cx="560" cy="450" r="8" fill="#2b2b2b"/>
  </g>

  <!-- chain -->
  <path d="M360 426 L230 442 M360 474 L230 458" stroke="#6b7175" stroke-width="4" fill="none"/>

  <!-- frame -->
  <g stroke="#2f6fe8" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="230" y1="450" x2="360" y2="450"/> <!-- chain stay -->
    <line x1="230" y1="450" x2="300" y2="320"/> <!-- seat stay -->
    <line x1="360" y1="450" x2="300" y2="320"/> <!-- seat tube -->
    <line x1="300" y1="320" x2="500" y2="300"/> <!-- top tube -->
    <line x1="360" y1="450" x2="500" y2="300"/> <!-- down tube -->
    <line x1="500" y1="300" x2="560" y2="450"/> <!-- fork -->
  </g>

  <!-- handlebar -->
  <g stroke="#2b2b2b" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="500" y1="300" x2="500" y2="272"/>
    <path d="M468 268 Q500 256 540 272"/>
  </g>
  <circle cx="540" cy="272" r="8" fill="#2b2b2b"/>

  <!-- saddle -->
  <ellipse cx="300" cy="312" rx="36" ry="11" fill="#2b2b2b"/>

  <!-- crank and chainring -->
  <circle cx="360" cy="450" r="24" stroke="#555" stroke-width="4" fill="none"/>
  <g stroke="#555" stroke-width="8" stroke-linecap="round">
    <line x1="360" y1="450" x2="392" y2="424"/>
    <line x1="360" y1="450" x2="330" y2="476"/>
  </g>
  <circle cx="360" cy="450" r="8" fill="#555"/>
  <rect x="382" y="417" width="26" height="12" rx="4" fill="#222"/>
  <rect x="316" y="470" width="26" height="12" rx="4" fill="#222"/>

  <!-- ================= PELICAN ================= -->

  <!-- legs -->
  <g stroke="#f0a500" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="300,285 318,378 392,424"/>
    <polyline points="316,288 342,392 340,470"/>
  </g>
  <!-- feet -->
  <path d="M392 424 l18 6 l-2 10 z" fill="#f0a500"/>
  <path d="M340 470 l18 6 l-2 10 z" fill="#f0a500"/>

  <!-- tail -->
  <path d="M225 245 Q185 250 178 272 Q210 268 232 258 Z" fill="#eef3f6" stroke="#cfd8de" stroke-width="2"/>

  <!-- far wing, spread wide for flight -->
  <path d="M250 210 Q168 118 86 94 Q170 150 190 210 Q220 242 250 210 Z"
        fill="#e3ebf1" stroke="#cfd8de" stroke-width="2"/>
  <g stroke="#cfd8de" stroke-width="2" fill="none">
    <path d="M242 206 Q182 150 120 112"/>
    <path d="M238 216 Q198 168 150 132"/>
  </g>

  <!-- neck -->
  <path d="M332 232 C 342 168 396 148 450 154" stroke="#cfd8de" stroke-width="54" fill="none" stroke-linecap="round"/>
  <path d="M332 232 C 342 168 396 148 450 154" stroke="#ffffff" stroke-width="46" fill="none" stroke-linecap="round"/>

  <!-- body -->
  <ellipse cx="285" cy="235" rx="78" ry="58" fill="url(#bodyGrad)" stroke="#cfd8de" stroke-width="2"/>

  <!-- wing reaching to handlebar -->
  <path d="M300 205 Q400 214 492 264 Q418 288 350 268 Q318 246 300 205 Z"
        fill="#eef3f6" stroke="#cfd8de" stroke-width="2"/>
  <g stroke="#cfd8de" stroke-width="2" fill="none">
    <path d="M330 224 Q392 232 456 258"/>
    <path d="M340 244 Q396 250 448 268"/>
  </g>

  <!-- head -->
  <circle cx="455" cy="150" r="30" fill="#ffffff" stroke="#cfd8de" stroke-width="2"/>

  <!-- beak: upper mandible -->
  <path d="M480 138 L622 168 L482 158 Z" fill="#f6b93b" stroke="#e0a02e" stroke-width="2"/>
  <!-- pouch -->
  <path d="M482 156 Q520 216 612 172 Q544 194 482 162 Z" fill="#ffd79a" stroke="#e6a94f" stroke-width="2"/>
  <!-- beak line -->
  <path d="M482 158 L618 169" stroke="#e0a02e" stroke-width="2" fill="none"/>

  <!-- eye -->
  <circle cx="463" cy="138" r="5.5" fill="#222"/>
  <circle cx="465" cy="136" r="1.8" fill="#ffffff"/>

  </g>

  <!-- motion streaks showing fast flight -->
  <g stroke="#9ad0ff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="200" x2="40" y2="200"/>
    <line x1="150" y1="250" x2="55" y2="250"/>
    <line x1="110" y1="300" x2="30" y2="300"/>
    <line x1="140" y1="350" x2="70" y2="350"/>
  </g>

  <!-- drifting feathers -->
  <g fill="#eef3f6" stroke="#cfd8de" stroke-width="1.5">
    <path d="M120 130 q14 -12 28 0 q-14 10 -28 0 z"/>
    <path d="M60 190 q12 -10 24 0 q-12 8 -24 0 z"/>
    <path d="M200 90 q10 -9 20 0 q-10 7 -20 0 z"/>
  </g>
</svg>
